# BUMP Builder Deployment
#
# Consumes merkle proof events, builds BUMP proofs for mined transactions.
#
# As of the microservice decomposition, this pod NO LONGER runs the
# block-processing watchdog — that responsibility moved to its own
# pod. See deploy/watchdog.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bsv-broadcaster-bump-builder
  namespace: arcade
  labels:
    app.kubernetes.io/name: bump-builder
    app.kubernetes.io/part-of: bsv-broadcaster
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bump-builder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bump-builder
        app.kubernetes.io/part-of: bsv-broadcaster
    spec:
      containers:
        - name: bsv-broadcaster
          # Pin to the git SHA published by .github/workflows/build.yml
          # (ghcr.io/bsv-blockchain/broadcaster:<sha>). The :latest tag moves.
          image: ghcr.io/bsv-blockchain/broadcaster:GIT_SHA
          args: ["--mode", "bump-builder"]
          ports:
            - containerPort: 8081
              name: health
              protocol: TCP
          env:
            - name: BSV_BROADCASTER_KAFKA_BROKERS
              value: "kafka-0.kafka.arcade.svc.cluster.local:9092"
            - name: BSV_BROADCASTER_KAFKA_CONSUMER_GROUP
              value: "arcade"
            - name: BSV_BROADCASTER_KAFKA_TOPIC_PREFIX
              value: "arcade"
            - name: BSV_BROADCASTER_STORE_AEROSPIKE_HOSTS
              value: "aerospike-0.aerospike.arcade.svc.cluster.local:3000"
            - name: BSV_BROADCASTER_STORE_AEROSPIKE_NAMESPACE
              value: "arcade"
            # Talk to the chaintracks pod over HTTP instead of running an
            # embedded ChainManager + upstream header poller in this pod.
            # The URL must include the /chaintracks path prefix: the
            # go-chaintracks remote client appends /v2/* to the base URL and
            # BSV Broadcaster's chaintracks pod serves /chaintracks/v2/*. The previous
            # suffix-less value 404'd on every request.
            - name: BSV_BROADCASTER_CHAINTRACKS_MODE
              value: "remote"
            - name: BSV_BROADCASTER_CHAINTRACKS_URL
              value: "http://bsv-broadcaster-chaintracks.arcade.svc.cluster.local:8083/chaintracks"
            # HOST_IP feeds OTEL_EXPORTER_OTLP_ENDPOINT below to reach the
            # node-local OTLP collector via the Kubernetes downward API; it
            # MUST be defined before its $(HOST_IP) use. Telemetry itself
            # stays off (BSV_BROADCASTER_TELEMETRY_ENABLED=false) until an operator
            # opts in — see docs/observability.md.
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://$(HOST_IP):4317"
            - name: BSV_BROADCASTER_TELEMETRY_ENABLED
              value: "false"
            - name: BSV_BROADCASTER_TELEMETRY_INSECURE
              value: "true"
          readinessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
