# Local microservices stack — compose analogue of the Kubernetes deployment in
# bsva-infra-flux/apps/base/arcade-v2 (teratestnet overlay), one replica each.
#
#   make docker-up                            # ghcr.io/bsv-blockchain/broadcaster:latest
#   BSV_BROADCASTER_IMAGE=bsv-broadcaster:local make docker-up  # after `make docker-build`
#
# BSV Broadcaster containers are distroless (no shell/curl) so they cannot carry compose
# healthchecks; ordering gates on infra healthchecks + topic-init, and
# `restart: on-failure` converges the rest (BSV Broadcaster fails fast when
# kafka/store/topics are not ready).

# Never group into a shared pod: all seven BSV Broadcaster services bind 8081 (health)
# and both postgreses bind 5432 — collisions in a shared netns.
x-podman:
  in_pod: false

# Compose analogue of the arcade-v2-env ConfigMap (_base/telemetry-env.yaml)
# plus per-deployment OTEL env; HOST_IP node agent replaced by otel-collector.
x-bsv-broadcaster-env: &bsv-broadcaster-env
  BSV_BROADCASTER_TELEMETRY_ENABLED: "true"
  BSV_BROADCASTER_TELEMETRY_INSECURE: "true"
  BSV_BROADCASTER_TELEMETRY_SAMPLE_RATIO: "0.1"
  OTEL_METRIC_EXPORT_INTERVAL: "15000"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  OTEL_RESOURCE_ATTRIBUTES: "service.namespace=bsv-broadcaster-compose"

# Every mode's bootstrap connects to Kafka AND the store and verifies topics
# (hard-failing unless bsv-broadcaster.propagation has exactly 1 partition).
x-bsv-broadcaster-depends: &bsv-broadcaster-depends
  redpanda:
    condition: service_healthy
  topic-init:
    condition: service_completed_successfully
  postgres:
    condition: service_healthy

# The shared config mount uses :z (shared SELinux label): it is mounted into
# seven containers, and :Z's private per-container label would let the
# last-started container lock the others out. Single-consumer mounts keep :Z.
x-bsv-broadcaster-common: &bsv-broadcaster-common
  image: ${BSV_BROADCASTER_IMAGE:-ghcr.io/bsv-blockchain/broadcaster:latest}
  volumes:
    - ./compose/bsv-broadcaster-config.yaml:/etc/bsv-broadcaster/config.yaml:ro,z
  networks:
    - bsv-broadcaster-net
  restart: on-failure
  depends_on:
    !!merge <<: *bsv-broadcaster-depends

services:
  # --- Infrastructure -------------------------------------------------------

  # Mirrors _base/redpanda.yaml: kafka API 9092, TLS off. Dual listeners:
  # internal for containers, external published for host tools.
  # docker.io mirror of docker.redpanda.com/redpandadata/redpanda — the
  # vendor registry stalls podman pulls from some networks.
  redpanda:
    image: docker.io/redpandadata/redpanda:v26.2.6
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      - --mode=dev-container
      - --smp=1
      - --default-log-level=info
    ports:
      - "19092:19092" # host tools: rpk -X brokers=localhost:19092
      - "19644:9644" # admin API
    volumes:
      - redpanda-data:/var/lib/redpanda/data:Z
    networks:
      - bsv-broadcaster-net
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # One-shot analogue of _base/topics.yaml; see compose/topic-init.sh.
  topic-init:
    image: docker.io/redpandadata/redpanda:v26.2.6
    entrypoint: ["/bin/bash", "/topic-init.sh"]
    # Keep in step with propagation.partitions in compose/bsv-broadcaster-config.yaml:
    # BSV Broadcaster hard-fails at boot if the topic has fewer partitions than the
    # service is configured for.
    environment:
      PROPAGATION_PARTITIONS: "${PROPAGATION_PARTITIONS:-1}"
    volumes:
      - ./compose/topic-init.sh:/topic-init.sh:ro,Z
    networks:
      - bsv-broadcaster-net
    restart: "no"
    depends_on:
      redpanda:
        condition: service_healthy

  # Mirrors _base/postgres.yaml. max_connections=500 is load-bearing:
  # 7 services x max_conns 25 = 175 > the alpine default of 100. The other
  # k8s tuning flags (2GB shared_buffers etc.) are dropped — laptop-sized.
  postgres:
    image: docker.io/library/postgres:18-alpine
    command: ["-c", "max_connections=500"]
    environment:
      POSTGRES_DB: bsv_broadcaster
      POSTGRES_USER: bsv_broadcaster
      POSTGRES_PASSWORD: bsv_broadcaster
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "15432:5432" # 5432 left free for a host postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data:Z
    networks:
      - bsv-broadcaster-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bsv_broadcaster -d bsv_broadcaster"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  # Optional Aerospike for `go test -tags=integration ./store/aerospike/...`
  # (localhost:3200, namespace bsv_broadcaster). Not used by the default postgres
  # stack — start with `docker compose --profile aerospike up -d aerospike`.
  # Pin is the current 7.0 line (same as deploy/aerospike.yaml), not :latest
  # (F-038 / #96). Digest is the multi-arch index for 7.0.0.26.
  aerospike:
    image: docker.io/aerospike/aerospike-server:8.2.0.1@sha256:b5480663bccabd84d8551171261080df3b509deffdd4667f28ec123524333a9a
    profiles: ["aerospike"]
    ports:
      - "3200:3000"
      - "3201:3001"
      - "3202:3002"
    volumes:
      - aerospike-data:/opt/aerospike/data:Z
      - ./compose/aerospike.conf:/opt/aerospike/etc/aerospike.conf:Z
    command: ["--config-file", "/opt/aerospike/etc/aerospike.conf"]
    networks:
      - bsv-broadcaster-net
    restart: unless-stopped

  # merkle-service's own database (never shared with BSV Broadcaster's; postgres:17
  # matches tests/e2e/harness/containers.go).
  merkle-postgres:
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_DB: merkle
      POSTGRES_USER: merkle
      POSTGRES_PASSWORD: merkle
    ports:
      - "15433:5432"
    volumes:
      - merkle-postgres-data:/var/lib/postgresql/data:Z
    networks:
      - bsv-broadcaster-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merkle -d merkle"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  # In k8s this is a separate app BSV Broadcaster calls over HTTP; included here so the
  # tx lifecycle works locally. Env layout proven by
  # tests/e2e/harness/containers.go:227-263; p2p values from the
  # merkle-service teratestnet configmap. Image digest = v0.2.5, same pin as
  # the e2e suite (`:latest` has regressed the BLOCK_PROCESSED round-trip).
  # CALLBACK_ALLOW_PRIVATE_IPS=true is REQUIRED: http://api-server:8080 is
  # RFC1918 and merkle-service's SSRF guard would otherwise reject it. BSV Broadcaster
  # forwards callback_url + callback_token per tx registration.
  merkle-service:
    image: ${MERKLE_IMAGE:-ghcr.io/bsv-blockchain/merkle-service@sha256:e8589dfdf896f39d7f5c8da2a71e9d220b4857735be7390166fdf80f83eb6845}
    environment:
      MODE: all-in-one
      LOG_LEVEL: info
      STORE_BACKEND: sql
      STORE_SQL_DRIVER: postgres
      STORE_SQL_DSN: postgres://merkle:merkle@merkle-postgres:5432/merkle?sslmode=disable
      KAFKA_BROKERS: redpanda:9092
      P2P_NETWORK: teratestnet
      P2P_BOOTSTRAP_PEERS: /dnsaddr/teratestnet.bootstrap.teranode.bsvb.tech
      P2P_DHT_MODE: "off"
      P2P_ENABLE_NAT: "false"
      P2P_ENABLE_MDNS: "false"
      CALLBACK_ALLOW_PRIVATE_IPS: "true"
      DATAHUB_ALLOW_PRIVATE_IPS: "true"
      BLOB_STORE_URL: "memory:"
    ports:
      - "18080:8080" # health/debug from the host (8080 is taken by api-server)
    networks:
      - bsv-broadcaster-net
    depends_on:
      merkle-postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    restart: on-failure

  # OTLP sink for the telemetry env above (tools/otel-collector.yaml
  # unchanged; debug exporter dumps traces/metrics to its logs).
  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:0.165.0
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./tools/otel-collector.yaml:/etc/otel-collector.yaml:Z
    ports:
      - "4317:4317"
      - "4318:4318"
    networks:
      - bsv-broadcaster-net
    restart: unless-stopped

  # --- BSV Broadcaster services: same image, role via --mode (mirrors _base/*.yaml) ---

  # http 8080; health/ready/metrics are on 8080 in this mode (not 8081).
  api-server:
    !!merge <<: *bsv-broadcaster-common
    command: ["--mode", "api-server"]
    environment:
      !!merge <<: *bsv-broadcaster-env
      OTEL_SERVICE_NAME: bsv-broadcaster-api-server
    ports:
      - "8080:8080"
    depends_on:
      !!merge <<: *bsv-broadcaster-depends
      chaintracks:
        condition: service_started
      merkle-service:
        condition: service_started

  propagation: # health 8081 only (unpublished)
    !!merge <<: *bsv-broadcaster-common
    command: ["--mode", "propagation"]
    environment:
      !!merge <<: *bsv-broadcaster-env
      OTEL_SERVICE_NAME: bsv-broadcaster-propagation

  # Mirrors _base/bump-builder.yaml env: header lookups against the
  # chaintracks service instead of an embedded ChainManager.
  bump-builder: # health 8081 (unpublished)
    !!merge <<: *bsv-broadcaster-common
    command: ["--mode", "bump-builder"]
    environment:
      !!merge <<: *bsv-broadcaster-env
      OTEL_SERVICE_NAME: bsv-broadcaster-bump-builder
      BSV_BROADCASTER_CHAINTRACKS_MODE: remote
      BSV_BROADCASTER_CHAINTRACKS_URL: http://chaintracks:8083
    depends_on:
      !!merge <<: *bsv-broadcaster-depends
      chaintracks:
        condition: service_started

  # GOMEMLIMIT mirrors _base/sse.yaml (kafka backlog replay bursts).
  sse: # http 8082 (SSE + /health /ready on same port)
    !!merge <<: *bsv-broadcaster-common
    command: ["--mode", "sse"]
    environment:
      !!merge <<: *bsv-broadcaster-env
      OTEL_SERVICE_NAME: bsv-broadcaster-sse
      GOMEMLIMIT: 400MiB
    ports:
      - "8082:8082"

  # Env pins THIS process to embedded mode (owns the header store) while the
  # shared config points every other consumer at it via remote mode. Named
  # volume persists synced headers across down/up — deviation from k8s (which
  # re-syncs per pod restart); cheap local QoL. volumes restated because YAML
  # merge keys do not merge lists.
  chaintracks: # http 8083 (+8081 health, unpublished)
    !!merge <<: *bsv-broadcaster-common
    command: ["--mode", "chaintracks"]
    environment:
      !!merge <<: *bsv-broadcaster-env
      OTEL_SERVICE_NAME: bsv-broadcaster-chaintracks
      BSV_BROADCASTER_CHAINTRACKS_MODE: embedded
    ports:
      - "8083:8083"
    volumes:
      - ./compose/bsv-broadcaster-config.yaml:/etc/bsv-broadcaster/config.yaml:ro,z
      - chaintracks-data:/root/.bsv-broadcaster:Z

  watchdog: # health 8081 only (unpublished)
    !!merge <<: *bsv-broadcaster-common
    command: ["--mode", "watchdog"]
    environment:
      !!merge <<: *bsv-broadcaster-env
      OTEL_SERVICE_NAME: bsv-broadcaster-watchdog

  # libp2p 9905 NOT published — k8s exposes no Service for it (outbound-only
  # discovery). Fresh peer key per recreate, same as the no-PVC k8s pod.
  p2p-client:
    !!merge <<: *bsv-broadcaster-common
    command: ["--mode", "p2p-client"]
    environment:
      !!merge <<: *bsv-broadcaster-env
      OTEL_SERVICE_NAME: bsv-broadcaster-p2p-client

networks:
  bsv-broadcaster-net:
    driver: bridge

volumes:
  redpanda-data:
  postgres-data:
  merkle-postgres-data:
  chaintracks-data:
  aerospike-data:
